# Семья, с которой приложение начинает: три группы, которые станут вашими, и аренда.
#
# «Еда», «Дорога» и «Медицина», у каждой свой лимит; «Аренда», которая несёт
# плату за жильё и больше ничего; и группы, нужные самому приложению для
# учёта. Переименуйте их, удалите, добавьте свои — прямо в приложении. Три
# месяца-примера в examples/ написаны под эти группы, и каждая сумма в них
# придумана.
#
# Править этот файл руками необязательно. Если всё же правите — сохраните
# оригинал: файл, который приложение не сможет прочитать, остановит запуск с
# сообщением о ключе.

version = 1

# =============================================================================
# ГРУППЫ
# =============================================================================
# Подгруппы входят в основные группы. У каждой основной группы есть уровень:
#
#   NECESSARY   складывается в первый итог
#   FREQUENT    прибавляется после него
#   OCCASIONAL  разовые группы, тоже прибавляются после
#   EXCLUDED    показывается, но никуда не прибавляется
#
# `limit` — в тысячах: 30 означает 30 000 тех денег, которыми вы пишете.

[groups]
# Должно равняться сумме лимитов ниже.
limit_total = 48

# Порядок блока лимитов.
limit_order = ["Еда", "Дорога", "Медицина"]

# Порядок страницы подгрупп.
minor_order = [
  "Аренда",
  "Еда",
  "Дорога",
  "Медицина",
  "Возвраты",
  "Снятие",
  # Нигде не учитывается, но показано, чтобы было видно начало месяца.
  "Зарплата",
]

# Группы, которые приложению нужны по их роли, как бы они ни назывались. Все
# называют подгруппу, кроме `rent`: она называет основную группу.
[groups.roles]
salary = "Зарплата"
reimbursements = "Возвраты"
withdrawal = "Снятие"
savings = "Накопления"
rent_lump = "Платёж аренды"
rent = "Аренда"
elsewhere = "Другое"

# --- то, что вы платите за крышу над головой ----------------------------------

# Сама аренда, и больше ничего: её сумма — это платёж из ваших записей
# («9400 аренда») или последний такой платёж, пока не появится новый. Группа,
# которая несёт аренду, не должна держать ничего другого: всё остальное,
# записанное в неё, эта сумма просто заменит.
[[groups.majors]]
name = "Аренда"
tier = "NECESSARY"
minors = []

# --- три группы, которые станут вашими ---------------------------------------

# Всё, что едят и пьют, где бы это ни купили.
[[groups.majors]]
name = "Еда"
tier = "NECESSARY"
minors = ["Еда"]
limit = 30

# Проезд, бензин, билеты — как бы вы ни передвигались.
[[groups.majors]]
name = "Дорога"
tier = "NECESSARY"
minors = ["Дорога"]
limit = 10

# Аптека, врач, стоматолог.
[[groups.majors]]
name = "Медицина"
tier = "NECESSARY"
minors = ["Медицина"]
limit = 8

# --- деньги, которые вернулись -----------------------------------------------

# Доход: возвраты и любое поступление, которому нет другого объяснения.
[[groups.majors]]
name = "Возвраты"
tier = "NECESSARY"
income = true
minors = ["Возвраты"]

# --- отложено: показывается полностью, никуда не прибавляется -----------------

# То, с чем сравнивается месяц, деньги, которые только переложили, и сама
# оплата аренды — сумму аренды несёт группа «Аренда».
[[groups.majors]]
name = "Отложено"
tier = "EXCLUDED"
minors = ["Зарплата", "Накопления", "Снятие", "Платёж аренды", "Другое"]

# =============================================================================
# РАЗБОР ЗАПИСЕЙ
# =============================================================================
# Шаблоны — регулярные выражения, регистр не важен; они проверяются по словам
# после суммы. Одинарные кавычки оставляют обратную косую черту как есть.
# «@имя» подставляет запись из [classify.patterns].
#
# Правил здесь намеренно мало: строка, слов которой правила не знают,
# становится вопросом, а один ответ — или выученное слово — учит приложение
# вашим словам.

[classify]

# Группы, которые называют магазин, а не вещь. «Посылки» пока не группа: она
# появится, когда первая такая строка туда попадёт.
platforms = ["Посылки"]
platform_words = 'посылк\w*'

# Выходы, которые забирают весь проезд своего блока: [шаблон, группа]. Пока нет.
contexts = []

# Как выход, но забирает проезд только если в том же блоке не покупали еду.
appointment = ['при[её]м\w*', "Приёмы"]

# Побеждает первое совпадение: узкие шаблоны — выше широких.
rules = [
  ['зарплат\w*|получк\w*', "Зарплата"],
  ['банкомат\w*|снятие|снял\w*', "Снятие"],
  ['накоплени\w*|сбережени\w*', "Накопления"],
  ['аренд\w*|квартплат\w*', "Платёж аренды"],
  ['\bтакси\b|\bавтобус\b|\bметро\b|\bпоезд\b|\bбилет\w*|\bбензин\b|\bтрамва\w*', "Дорога"],
  ['\bаптек\w*|\bтаблетк\w*|\bврач\w*|\bстоматолог\w*|\bпластыр\w*|\bсироп\w*', "Медицина"],
  ["@food_words", "Еда"],
  ['посылк\w*', "Посылки"],
]

# Каждая запись: группа = [текст вопроса, [группы на выбор]]. Пока нет.
[classify.context_questions]

# Шаблоны, сохранённые под именем; список склеивается в один через |.
[classify.patterns]
# Съедено там, где куплено.
meals = ['\bкафе\b', '\bсуп\b', '\bпирог\w*', '\bсэндвич\w*']
# Всё съедобное.
food_words = [
  'ед[аыуе]', 'продукт\w*', 'бакале\w*', 'молоко', 'яйц\w*', 'фрукт\w*',
  'овощ\w*', 'сыр', 'рис', 'макарон\w*', 'масло', 'йогурт\w*',
  'кафе', 'суп', 'пирог\w*', 'сэндвич\w*',
  # Напитки: по умолчанию еда, и о них всегда спрашивают (см. [classify.alcohol]).
  '\bвино\b', '\bпиво\b',
]
# Места, а не вещи. Обычные слова, поэтому «70 бар» читается как еда.
pubs = '\bбар\b|\bпаб\b'
named_restaurants = '\bресторан\w*|\bстолов\w*'
# Слова, которые значат, что еду принесли домой.
groceries = 'продукт\w*|бакале\w*|ед[аыуе]|молоко|яйц\w*|рис|макарон\w*'

# Как движутся деньги на еду: одна строка забирает всё — наличные, карту и
# проезд до магазина.
[classify.food]
cash = "Еда"
card = "Еда"
taxi = "Дорога"

# День, оплаченный как один: дорога туда, проезд на месте и еда там. `fare` —
# самая дешёвая поездка, которая читается как такой день; здесь она выше любой
# обычной, поэтому дни не собираются, пока вы её не уменьшите.
[classify.trip]
road = "Дорога"
taxi = "Дорога"
restaurants = "Еда"
fare = 100000
legs = []

# Цены билетов: голая сумма, равная одной из них, — это проезд. Впишите свои.
[classify.fares]
tickets = []

# Спиртное по умолчанию идёт в «Еду», и о нём всегда спрашивают.
[classify.alcohol]
words = 'вино|пиво'
celebration = "Праздники"

# Траты, которые делят с кем-то ещё:
#   settlement  деньги от него или отданные, чтобы рассчитаться
#   named       деньги, где он просто упомянут
[classify.settlements]
partner = "друг"
group = "Общее"
settlement = 'рассчитались|в\s+расч[её]те'
named = 'вместе\s+с'

# Поступление, которое само себя объясняет: «+ 1200 возврат» идёт в «Возвраты».
# Так читаются только поступления, поэтому покупка, часть которой вернули
# на месте, «740 пряжа (-210 возврат)», остаётся с тем, что купили.
[classify.reimbursements]
named = 'возврат\w*|вернули'

[classify.thresholds]
# Самое маленькое голое поступление, которое читается как зарплата и начинает
# месяц. Месяц открывает именно голая сумма — «+ 57 300», без слова после
# неё; «+ 57 300 зарплата» — обычное поступление, его заберёт правило выше.
# Поставьте число выше обычных поступлений и ниже своей зарплаты.
salary_floor = 32000
# Цветы дешевле этого идут в «Еду», дороже — становятся своей группой.
flower_ceiling = 140

# 1: аренда платится каждый месяц, и платёж месяца — его аренда.
# 2: платится раз в два месяца, каждый платёж делится на два месяца.
[classify.rent]
months = 1

# =============================================================================
# ПОКАЗ
# =============================================================================
#   per_visit_whole    одна сумма за посещение, вместе с проездом
#   per_visit_service  за посещение, но плата и проезд показаны отдельно

[display]
per_visit_whole = []
per_visit_service = []

# =============================================================================
# ОСТАТОК — суммы, которыми заканчивается день
# =============================================================================
# По строке на каждую сумму, в том порядке, в каком они записаны. `kind`
# определяет, как сумма меняется, когда приложение продолжает её после
# последней записанной строки:
#
#   card   остаток на карте: оплата картой, зарплата, возвраты и накопления
#   cash   наличные на руках: всё остальное и снятия со счёта
#   purse  недельные деньги, которые обновляются в выбранный день недели
#   carry  остаётся как записано
#
# `unit` — «whole» для суммы, записанной полностью, иначе тысячи (по
# умолчанию). Подпись идёт перед суммой, если не указано `place = "after"`.
#
# Писать такую строку необязательно: без неё всё это не важно.

[left]

# «наличные 6,8»: наличные на руках, в тысячах.
[[left.slots]]
id = "purse"
label = "наличные"
kind = "cash"
decimals = 1

# «счёт 62730»: счёт, полной суммой.
[[left.slots]]
id = "account"
label = "счёт"
kind = "card"
unit = "whole"
decimals = 0

# =============================================================================
# ЗАПИСИ — слова, которые делают строку указанием, а не тратой
# =============================================================================

[notes]
left = 'Остаток|Осталось|L?eft'
left_word = "Остаток"
decimal = ","
skip = '''не\s+считать|не\s+считаем|не\s+учитывать|не\s+в\s+сч[её]т|do not count|don'?t count|not counted'''
previous = '(?:за\s+)?(?:прошлый|предыдущий)\s+месяц|previous month'
refers = 'относится\s+к|refers to'
months = [
  'январ[ьяюе]|january', 'феврал[ьяюе]|february', 'март[ауе]?|march',
  'апрел[ьяюе]|april', 'ма[йяюе]|may', 'июн[ьяюе]|june', 'июл[ьяюе]|july',
  'август[ауе]?|august', 'сентябр[ьяюе]|september', 'октябр[ьяюе]|october',
  'ноябр[ьяюе]|november', 'декабр[ьяюе]|december',
]
capitalise_months = false
occasion = '\s*(?:st|nd|rd|th)?\s+(?:of\s+)?'
refund = 'возврат|return|refund'
# Эта семья не собирает дни целиком (см. [classify.trip]), поэтому ни одно
# слово не делает строку их проездом: «160 такси» — обычная строка, её относит
# правило выше. Впишите сюда свои слова, если захотите собирать такие дни.
taxi = 'проезд собранного дня|fare on a gathered day'
road = 'дорога к собранному дню|the way to a gathered day'
homeward = 'домой|обратно|назад|to\s+home|back'
prepayment = 'аванс\w*|предоплат\w*|pre[-\s]?payment'
flowers = '\bцвет(?:ы|ок|очки|ов|очек)\b|\bроз(?:а|ы|у)\b|\bflower|\brose'
food = 'продукт\w*|ед[аыу]|food'
and = '\bи\b|\band\b'
thousands = '[kк]'
card = 'карт(?:а|ой|у|е|очка|очкой|очку)|по\s+карте|card'
card_ledger = '\bкарт(?:а|ой|у|е|очка|очкой|очку)\b|\bпо\s+карте\b|card'
gift = '(подар(?:ок|ки|ка|ку))\s+((?:для\s+)?\w+)'
tip = 'ча[её]в\w*|на\s+чай|tips?'
stop_words = [
  "или", "для", "без", "про", "над", "под", "при", "что", "как", "его", "наш",
  "наша", "наши", "мой", "моя", "мои", "свой", "один", "одна", "два", "две", "три",
  "это", "тоже", "ещё", "еще", "новый", "новая", "новое", "новые", "новую",
  "старый", "старая", "старое", "старые", "старую", "обратно",
  "назад", "домой",
  "or", "and", "the", "for", "of", "to", "in", "on", "at", "from",
  "back", "her", "his", "our", "new", "old", "one", "two",
]
ocr = "rus+eng"
